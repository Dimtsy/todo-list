<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список задач</title>
  <meta name="description" content="Простой и аккуратный список задач с сохранением в браузере." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Список задач</h1>
      <p class="app__date" id="today"></p>
    </header>

    <!-- Форма добавления задачи -->
    <form class="add-form" id="add-form" autocomplete="off">
      <input
        class="add-form__input"
        id="task-input"
        type="text"
        placeholder="Что нужно сделать?"
        maxlength="200"
        aria-label="Новая задача"
      />
      <button class="add-form__btn" type="submit" aria-label="Добавить задачу">
        <span class="add-form__plus">+</span>
        <span class="add-form__label">Добавить</span>
      </button>
    </form>

    <!-- Фильтры -->
    <nav class="filters" aria-label="Фильтр задач">
      <button class="filters__btn is-active" data-filter="all">Все</button>
      <button class="filters__btn" data-filter="active">Активные</button>
      <button class="filters__btn" data-filter="done">Выполненные</button>
    </nav>

    <!-- Список задач -->
    <ul class="task-list" id="task-list"></ul>

    <!-- Пустое состояние -->
    <div class="empty" id="empty" hidden>
      <div class="empty__icon">📝</div>
      <p class="empty__text" id="empty-text">Задач пока нет. Добавьте первую!</p>
    </div>

    <!-- Нижняя панель -->
    <footer class="app__footer" id="footer" hidden>
      <span id="counter"></span>
      <button class="link-btn" id="clear-done">Очистить выполненные</button>
    </footer>

    <p class="hint">Двойной клик по задаче — редактирование</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
